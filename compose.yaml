services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: warranty_claims
      POSTGRES_USER: claims
      POSTGRES_PASSWORD: claims
    ports:
      - "5434:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U claims -d warranty_claims"]
      interval: 5s
      timeout: 3s
      retries: 20

  s3mock:
    image: adobe/s3mock:5.0.0
    environment:
      COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS: claim-documents
      COM_ADOBE_TESTING_S3MOCK_STORE_ROOT: /s3mockroot
      COM_ADOBE_TESTING_S3MOCK_STORE_RETAIN_FILES_ON_EXIT: "true"
    ports:
      - "9090:9090"
    volumes:
      - s3-data:/s3mockroot

  soap:
    image: wiremock/wiremock:3.13.1
    volumes:
      - ./wiremock:/home/wiremock:ro
    ports:
      - "8081:8080"

  app:
    build: .
    environment:
      DB_URL: jdbc:postgresql://db:5432/warranty_claims
      DB_USER: claims
      DB_PASSWORD: claims
      SOAP_URL: http://soap:8080/soap/warranties
      S3_ENDPOINT: http://s3mock:9090
      S3_BUCKET: claim-documents
      S3_ACCESS_KEY: demo
      S3_SECRET_KEY: demo
      APP_APPLICANT_PASSWORD: demo-applicant
      APP_REVIEWER_PASSWORD: demo-reviewer
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
      s3mock:
        condition: service_started
      soap:
        condition: service_started

volumes:
  postgres-data:
  s3-data:
